# Default configuration for DevGuides
# This file can be overridden by user configuration files

server:
  command: "python"
  args: ["-m", "codeflowgraph.mcp_server"]
  timeout: 30
  env:
    PYTHONPATH: "../codeflowgraph"

llm:
  provider: "openai"
  model: "gpt-4"
  max_tokens: 2000
  temperature: 0.3
  timeout: 60

output:
  format: "markdown"
  include_diagrams: true
  template: "default"
  output_directory: "./docs"
  file_naming: "query_based"
  max_file_size: 50000

generation:
  detail_level: "comprehensive"
  include_examples: true
  max_results: 10
  timeout: 60
  retry_attempts: 3
  retry_delay: 1.0

logging:
  level: "INFO"
  format: "text"
  file_path: null
  max_file_size: 10485760
  backup_count: 5