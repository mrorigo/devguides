[project]
name = "devguides"
version = "0.1.0"
description = "AI-powered developer documentation generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "DevGuides Team", email = "team@devguides.ai"}
]
license = {text = "MIT"}
keywords = ["documentation", "code-analysis", "ai", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",           # CLI framework
    "pydantic>=2.0.0",        # Configuration validation
    "pyyaml>=6.0",            # YAML config parsing
    "mcp[cli]>=0.5.0",        # MCP protocol client (CLI variant)
    "openai>=1.0.0",          # LLM API integration
    "rich>=13.0.0",           # Terminal output formatting
    "structlog>=22.0.0",      # Structured logging
    "asyncio-throttle>=1.0.2", # Rate limiting for API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
local-llm = [
    "ollama>=0.1.0",
    "transformers>=4.20.0",
    "torch>=1.12.0",
]
all = [
    "devguides[dev,local-llm]"
]

[project.urls]
Homepage = "https://github.com/devguides/devguides"
Documentation = "https://devguides.readthedocs.io/"
Repository = "https://github.com/devguides/devguides.git"
"Bug Tracker" = "https://github.com/devguides/devguides/issues"

[project.scripts]
devguides = "devguides.cli.commands:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devguides"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=devguides --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["devguides"]
omit = ["tests/*"]
